server:
  host: 0.0.0.0
  port: 8317
deepseek:
  api_base: https://api.deepseek.com
  api_keys: []
  thinking_disabled: true
reliability:
  retry:
    max_retries: 3
    backoff_base: 2.0
  circuit_breaker:
    failure_threshold: 5
    cooldown_seconds: 30.0
  concurrency:
    max_concurrent: 10
    queue_timeout: 30.0
  rate_limit:
    requests_per_minute: 30
    burst_size: 30
model_map:
  gpt-5.5: deepseek-v4-pro
  gpt-5.4: deepseek-v4-pro
  gpt-5.4-mini: deepseek-v4-pro
  deepseek-v4-pro: deepseek-v4-pro
  glm-5.1: siliconflow:Pro/zai-org/GLM-5.1
providers:
  bailian:
    api_base: https://dashscope.aliyuncs.com/compatible-mode
    api_keys: []
  siliconflow:
    api_base: https://api.siliconflow.cn
    api_keys: []
